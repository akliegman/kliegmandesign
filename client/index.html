    <!-- Apply saved theme and motion choices before first paint (keys in src/lib/theme.ts and motion.ts). -->
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.classList.add(theme);
        if (localStorage.getItem("motion") === "paused") document.documentElement.dataset.motion = "paused";
      } catch {}
    </script>
    <title>Adam Kliegman, software engineer for design systems and frontend architecture</title>
